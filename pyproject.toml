[project]
name = "ford-api"
version = "0.1.0"
description = "Ford Challenge — SOA + Cybersecurity backend"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "anyio>=4.14.2",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
ford-shared = { workspace = true }

[tool.uv]
exclude-newer = "2026-09-18T00:00:00Z"  # nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
constraint-dependencies = ["starlette>=1.1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/migrations/env.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services"]
