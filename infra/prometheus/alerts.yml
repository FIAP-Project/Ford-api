groups:
  - name: ford-api
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (service) (rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has a 5xx rate above 5% over 5m"

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency above 2s over 5m"

      - alert: AuthFailedSpike
        expr: sum(rate(http_requests_total{service="auth-service", path="/auth/login", status="401"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated failed-login rate on auth-service (possible credential stuffing / brute force)"

      - alert: ClaudeApiFailureSpike
        expr: rate(claude_request_failures_total[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Claude API failure rate elevated on vehicle-service (upstream provider degraded)"
