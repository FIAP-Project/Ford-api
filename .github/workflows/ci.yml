name: CI/DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  UV_VERSION: "0.4"

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 — Lint (style + basic security rules via ruff's "S"/bandit set)
  # ---------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff (lint + bandit-lite "S" rules)
        run: uv run ruff check .

  # ---------------------------------------------------------------------
  # Stage 2 — SAST (Semgrep): finds injection, auth, and crypto bug patterns
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.28.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------
  # Stage 3 — SCA: known-vulnerability scan of every resolved dependency
  # ---------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Export third-party requirements
        run: |
          uv export --frozen --all-packages --no-emit-workspace \
            --format requirements-txt > requirements-audit.txt

      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Audit resolved dependencies for known CVEs
        # PYSEC-2026-1325 (ecdsa Minerva timing attack, CVE-2024-23342): ecdsa is a
        # transitive dependency of python-jose, which we install with the
        # [cryptography] extra, so the actual JWT signing/verification path uses the
        # cryptography backend, not pure-python ecdsa. Upstream has no planned fix
        # (side-channel attacks are explicitly out of scope for python-ecdsa).
        run: |
          uv run pip-audit --strict --progress-spinner=off \
            --ignore-vuln PYSEC-2026-1325 \
            -r requirements-audit.txt

  # ---------------------------------------------------------------------
  # Stage 4 — Secret scanning: fail the build if a credential was committed
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan (Gitleaks)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source="/repo" --redact -v

  # ---------------------------------------------------------------------
  # Stage 5 — Tests: the SOA integration suite (packages + all services)
  # ---------------------------------------------------------------------
  test:
    name: Tests (pytest)
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run test suite
        run: uv run pytest packages services -q

  # ---------------------------------------------------------------------
  # Stage 6 — Build image + Stage 7 — Container scan (Trivy), per service
  # ---------------------------------------------------------------------
  build-and-scan:
    name: Build & scan (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, vehicle-service, audit-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ford-api/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # 0.24.0
        with:
          image-ref: ford-api/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.28.1
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
