name: CI/DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  UV_VERSION: "0.4"

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 — Lint (style + basic security rules via ruff's "S"/bandit set)
  # ---------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff (lint + bandit-lite "S" rules)
        run: uv run ruff check .

  # ---------------------------------------------------------------------
  # Stage 2 — SAST (Semgrep): finds injection, auth, and crypto bug patterns
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------
  # Stage 3 — SCA: known-vulnerability scan of every resolved dependency
  # ---------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Audit resolved dependencies for known CVEs
        run: uv run pip-audit --strict --progress-spinner=off

  # ---------------------------------------------------------------------
  # Stage 4 — Secret scanning: fail the build if a credential was committed
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan (Gitleaks)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source="/repo" --redact -v

  # ---------------------------------------------------------------------
  # Stage 5 — Tests: the SOA integration suite (packages + all services)
  # ---------------------------------------------------------------------
  test:
    name: Tests (pytest)
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest packages services -q

  # ---------------------------------------------------------------------
  # Stage 6 — Build image + Stage 7 — Container scan (Trivy), per service
  # ---------------------------------------------------------------------
  build-and-scan:
    name: Build & scan (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, vehicle-service, audit-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ford-api/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ford-api/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
